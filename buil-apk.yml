name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Create www folder and copy files
        run: |
          mkdir -p www
          cp *.html www/ 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true

      - name: Setup Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          export JAVA_HOME=${{ env.JAVA_HOME }}
          ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx2048m" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitForge-APK
          path: android/app/build/outputs/apk/release/
          retention-days: 30
