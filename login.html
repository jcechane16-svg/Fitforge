<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitForge | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="login">
    <header class="topbar auth-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="FitForge home">
          <span class="brand-mark">F</span>
          <span>FitForge</span>
        </a>
      </div>
    </header>

    <main class="auth-shell">
      <section class="auth-card">
        <div class="auth-intro">
          <span class="eyebrow">Welcome back</span>
          <h1>Log in to your account</h1>
          <p>Access your dashboard, goals, workouts, and progress.</p>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
          <div class="field-group">
            <label for="usernameOrEmail">Username or Email</label>
            <input id="usernameOrEmail" name="usernameOrEmail" type="text" placeholder="Enter username or email" required />
            <small class="error-text" data-error-for="usernameOrEmail"></small>
          </div>

          <div class="field-group">
            <label for="loginPassword">Password</label>
            <div class="password-wrap">
              <input id="loginPassword" name="password" type="password" placeholder="Enter password" required />
              <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Show password">Show</button>
            </div>
            <small class="error-text" data-error-for="loginPassword"></small>
          </div>

          <div class="row between align-center checkbox-row">
            <label class="check-inline">
              <input type="checkbox" id="rememberMe" />
              <span>Remember me</span>
            </label>
            <a href="signup.html" class="text-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block login-submit">
            <span class="btn-label">Log In</span>
            <span class="spinner hidden" aria-hidden="true"></span>
          </button>

          <p class="auth-switch">
            New to FitForge?
            <a href="signup.html">Create an account</a>
          </p>
        </form>
      </section>
    </main>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
