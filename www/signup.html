<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitForge | Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="signup">
    <header class="topbar auth-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="FitForge home">
          <span class="brand-mark">F</span>
          <span>FitForge</span>
        </a>
      </div>
    </header>

    <main class="auth-shell">
      <section class="auth-card wide-card">
        <div class="auth-intro">
          <span class="eyebrow">Join the community</span>
          <h1>Create your FitForge account</h1>
          <p>Start tracking workouts, habits, and results with confidence.</p>
        </div>

        <form id="signupForm" class="auth-form signup-form" novalidate>
          <div class="two-col">
            <div class="field-group">
              <label for="fullName">Full Name</label>
              <input id="fullName" name="fullName" type="text" placeholder="Enter your full name" required />
              <small class="error-text" data-error-for="fullName"></small>
            </div>

            <div class="field-group">
              <label for="username">Username</label>
              <input id="username" name="username" type="text" placeholder="Choose a username" required />
              <small class="error-text" data-error-for="username"></small>
            </div>
          </div>

          <div class="two-col">
            <div class="field-group">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" placeholder="you@example.com" required />
              <small class="error-text" data-error-for="email"></small>
            </div>

            <div class="field-group">
              <label for="age">Age</label>
              <input id="age" name="age" type="number" min="10" max="120" placeholder="Age" required />
              <small class="error-text" data-error-for="age"></small>
            </div>
          </div>

          <div class="two-col">
            <div class="field-group">
              <label for="password">Password</label>
              <div class="password-wrap">
                <input id="password" name="password" type="password" placeholder="Create a strong password" required />
                <button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button>
              </div>
              <div class="strength-meter" aria-live="polite">
                <span id="strengthBar"></span>
              </div>
              <small id="strengthText" class="strength-text">Password strength: weak</small>
              <small class="error-text" data-error-for="password"></small>
            </div>

            <div class="field-group">
              <label for="confirmPassword">Confirm Password</label>
              <div class="password-wrap">
                <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm password" required />
                <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show confirm password">Show</button>
              </div>
              <small class="error-text" data-error-for="confirmPassword"></small>
            </div>
          </div>

          <div class="two-col">
            <div class="field-group">
              <label for="gender">Gender</label>
              <select id="gender" name="gender">
                <option value="">Select</option>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Non-binary">Non-binary</option>
                <option value="Prefer not to say">Prefer not to say</option>
              </select>
              <small class="error-text" data-error-for="gender"></small>
            </div>

            <div class="field-group">
              <label for="height">Height (cm)</label>
              <input id="height" name="height" type="number" min="50" max="250" step="0.1" placeholder="e.g. 170" required />
              <small class="error-text" data-error-for="height"></small>
            </div>
          </div>

          <div class="field-group">
            <label for="weight">Weight (kg)</label>
            <input id="weight" name="weight" type="number" min="20" max="300" step="0.1" placeholder="e.g. 68" required />
            <small class="error-text" data-error-for="weight"></small>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Create Account</button>

          <p class="auth-switch">
            Already have an account?
            <a href="login.html">Log in</a>
          </p>
        </form>
      </section>
    </main>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
